html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: игровой стол — сверху маршрут из 6 станций, в центре карта и вопросы, снизу панель хода */
:root{
  --bg:#E4E8F1; --card:#FCFCFF; --ink:#23275C; --muted:#5B6089; --line:#C4CADD; --chip:#EEF0F8;
  --sun:#EFAE34; --coral:#DD5B45; --shadow:rgba(35,39,92,.35);
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12142B; --card:#1D2042; --ink:#E6E8FB; --muted:#A0A5CC; --line:#343867; --chip:#262A52;
  --sun:#F2B640; --coral:#F07A63; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12142B; --card:#1D2042; --ink:#E6E8FB; --muted:#A0A5CC; --line:#343867; --chip:#262A52;
  --sun:#F2B640; --coral:#F07A63; --shadow:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1}
h2{font-size:clamp(1.25rem,3.6vw,1.6rem);line-height:1.2}
h3{font-size:1rem;line-height:1.3}
p{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.method{display:inline-block;font-size:.78rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
.lead{color:var(--muted);max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* шапка и маршрут */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--muted)}
.ghost.warn{border-color:var(--coral);color:var(--coral)}
.route{position:relative;display:grid;grid-template-columns:repeat(7,1fr);margin:6px 0 26px}
.route::before{content:"";position:absolute;left:7%;right:7%;top:15px;border-top:2px dashed var(--line)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.dot{width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font:600 .78rem var(--display);color:var(--muted);position:relative}
.node.done .dot{background:var(--ink);border-color:var(--ink);color:var(--card)}
.node.now .dot{border-color:var(--coral);background:var(--card);color:var(--coral)}
.node.now .dot::after{content:"";position:absolute;top:-13px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--coral)}
.nlabel{font-size:.7rem;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.node.now .nlabel{color:var(--ink);font-weight:600}
@media (max-width:560px){.nlabel{display:none}.node.now .nlabel{display:block;position:absolute;top:38px;overflow:visible}.route{margin-bottom:34px}}

/* карты */
.stage-head{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.duo{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:640px){.duo{grid-template-columns:minmax(0,1fr)}.duo>.pcard{width:min(210px,70%);margin:0 auto}}
.pcard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;aspect-ratio:5/7;padding:28px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 0 var(--line),0 16px 30px -18px var(--shadow);max-width:100%}
.pcard .art{width:100%;max-width:170px;height:auto}
.pcard figcaption,.pcard .cap{font:600 .82rem var(--display);text-align:center;text-wrap:balance}
.ix{position:absolute;font:600 .66rem var(--display);color:var(--coral);letter-spacing:.04em;line-height:1.1;text-align:center}
.ix.tl{top:10px;left:12px}.ix.br{bottom:10px;right:12px;transform:rotate(180deg)}
.deal .pcard,.deal .ins{animation:deal .55s cubic-bezier(.2,.8,.2,1) both}
.deal .qs{animation:rise .5s .1s ease-out both}
@keyframes deal{from{transform:perspective(700px) rotateY(70deg) translateY(10px);opacity:.3}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.deal .pcard,.deal .ins,.deal .qs{animation:none}}

/* иллюстрации */
.art .i{fill:var(--ink)}.art .s{fill:var(--sun)}.art .c{fill:var(--coral)}.art .p{fill:var(--card)}
.art .ln{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.art .thin{stroke-width:3}.art .thick{stroke-width:9}
.art .lnc{stroke:var(--coral)}.art .lns{stroke:var(--sun)}.art .lnp{stroke:var(--card)}
.art .pl{fill:var(--card);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.art .dash{stroke-dasharray:3 7}

/* вопросы */
.qs{display:flex;flex-direction:column;gap:18px;min-width:0}
.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.q>label,.q>.lbl{font-weight:600;line-height:1.35}
.q small{color:var(--muted)}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.75}
.pips{display:grid;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));gap:4px}
.pip{height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--chip);font-variant-numeric:tabular-nums;font-weight:600;padding:0}
.pip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.pip.lit{background:color-mix(in srgb,var(--sun) 40%,var(--chip))}
.scale-ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--coral)}
.range-row output{font:600 1rem var(--display);min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}

/* колоды-сетки */
.deck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:560px){.deck{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.mcard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:12px;aspect-ratio:5/7;padding:10px;display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 20px -14px var(--shadow)}
.mcard .art{width:100%}
.mcard.on{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral)}
.mcard.dim{opacity:.35}
.badge{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;font:700 .8rem var(--display);display:grid;place-items:center}
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tcards{grid-template-columns:minmax(0,1fr)}}
.tcard{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.tcard .art{width:46px;flex:none}
.tcard b{display:block;font-family:var(--display);font-size:.86rem;font-weight:600;margin-bottom:3px}
.tcard span{font-size:.88rem;color:var(--muted);display:block}
.tcard em{font-style:normal;font-size:.82rem;color:var(--muted);display:block;margin-top:4px}
.tcard.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.tcard{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 14px;font-size:.9rem;text-align:left}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.quote{border-left:4px solid var(--sun);padding:6px 0 6px 14px;font-style:italic}
.tip{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:.92rem}
.tip b{font-weight:600}

/* колода энергии */
.edeck{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.edeck{grid-template-columns:minmax(0,1fr)}.edeck .pile{width:min(220px,72%);margin:0 auto}}
.pile{position:relative}
.pile::before,.pile::after{content:"";position:absolute;inset:0;border-radius:16px;background:var(--ink);opacity:.18;transform:rotate(-4deg) translate(-6px,4px)}
.pile::after{opacity:.1;transform:rotate(5deg) translate(8px,6px)}
.pile .pcard{z-index:1}
.pcard .stmt{font:500 1rem/1.35 var(--body);text-align:center;text-wrap:balance}
.ebtns{display:flex;flex-direction:column;gap:10px}
.ebtn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:600}
.ebtn i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--display);flex:none}
.ebtn.plus i{background:var(--sun);color:#23275C}.ebtn.zero i{background:var(--chip);border:1.5px solid var(--line)}.ebtn.minus i{background:var(--coral);color:#fff}
.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.erow span{min-width:0;font-size:.92rem}
.seg{display:flex;flex:none;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--chip);padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.seg button.on.p{background:var(--sun);color:#23275C}.seg button.on.z{background:var(--ink);color:var(--card)}.seg button.on.m{background:var(--coral);color:#fff}

/* карты открытия */
.ins{background:var(--ink);color:var(--card);border-radius:20px;padding:26px 24px;position:relative;overflow:hidden;box-shadow:0 20px 40px -24px var(--shadow)}
.ins::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--sun);opacity:.9}
.ins>*{position:relative;z-index:1}
.ins .eyebrow{color:color-mix(in srgb,var(--card) 70%,transparent)}
.ins h2{margin:6px 0 14px;max-width:80%}
.ins .row{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 2.6rem;gap:10px;align-items:center;font-size:.92rem;padding:4px 0}
.ins .track{height:10px;border-radius:5px;background:color-mix(in srgb,var(--card) 18%,transparent);overflow:hidden}
.ins .fill{height:100%;background:var(--coral);border-radius:5px}
.ins .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ins p{max-width:60ch}
.ins .pair{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ins .mini{width:96px;background:var(--card);border-radius:10px;padding:8px;aspect-ratio:5/7;display:grid;place-items:center}
.ins .arrow{font:700 1.6rem var(--display);color:var(--sun)}
.ins .code{font:700 2.8rem/1 var(--display);color:var(--sun);letter-spacing:.06em}
.ins .tag{display:inline-block;background:color-mix(in srgb,var(--card) 14%,transparent);border-radius:8px;padding:3px 9px;margin:2px 4px 2px 0;font-size:.88rem}
.hand-note{margin-top:14px;color:var(--muted);font-size:.9rem}

/* финал */
.final{display:flex;flex-direction:column;gap:18px}
.fhead{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet .eyebrow{color:var(--coral)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.frow{display:grid;grid-template-columns:minmax(0,10.5rem) minmax(0,1fr) 2.4rem;gap:10px;align-items:center;font-size:.92rem}
.frow .track{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.frow .fill{height:100%;border-radius:5px;background:var(--line)}
.frow.pain .fill{background:var(--coral)}.frow.pain{font-weight:600}
.frow.ok .fill{background:var(--sun)}
.frow .num{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scen{background:var(--ink);color:var(--card);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.scen .eyebrow{color:var(--sun)}
.scen ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.dirs{display:flex;flex-wrap:wrap;gap:8px}
.dirs span{background:var(--chip);border-radius:8px;padding:5px 10px;font-size:.9rem}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;background:var(--ink);color:var(--card)}
.btn.alt{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.hand{flex:1;display:flex;align-items:center;gap:10px;min-width:0;font-size:.84rem;color:var(--muted)}
.fan{display:flex;flex:none}
.fan i{width:18px;height:25px;border-radius:4px;background:var(--sun);border:1.5px solid var(--ink);margin-left:-8px;display:block}
.fan i:first-child{margin-left:0}
.fan i.empty{background:transparent;border-style:dashed;border-color:var(--line)}
.hint{font-size:.8rem;color:var(--coral);line-height:1.25}
.sr{display:none;font:600 .8rem var(--display)}
@media (max-width:440px){.sr{display:inline}}
.intro-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.intro-grid{grid-template-columns:minmax(0,1fr)}}
.fanbig{position:relative;height:250px;max-width:100%}
.fanbig .pcard{position:absolute;width:150px;left:50%;top:10px;margin-left:-75px;padding:20px 12px 12px}
.rules{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start}
.rules li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun);color:#23275C;display:grid;place-items:center;font:700 .78rem var(--display)}
.note{font-size:.84rem;color:var(--muted)}
button,.mcard,.chip,.tcard,.pip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (hover:none){.mcard:hover{transform:none;box-shadow:none}}
.swipe-hint{display:none;font-size:.8rem;color:var(--muted);text-align:center}
@media (pointer:coarse){.swipe-hint{display:block}}
.pile .pcard{touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s}
@media (max-width:640px){
  .wrap{padding-block:12px 112px}
  .top{margin-bottom:6px}
  .route{margin:4px 0 30px}
  .dot{width:26px;height:26px;font-size:.7rem}
  .route::before{top:12px}
  .stage-head{gap:6px;margin-bottom:14px}
  .method{font-size:.7rem}
  .duo{gap:18px}
  .duo>.pcard{width:min(168px,50%);padding:22px 12px 12px}
  .edeck .pile{width:min(200px,62%)}
  .qs{gap:16px}
  .ins{padding:20px 18px}
  .ins .row{grid-template-columns:minmax(0,7.2rem) minmax(0,1fr) 2.2rem;font-size:.86rem}
  .frow{grid-template-columns:minmax(0,7.6rem) minmax(0,1fr) 2.2rem;font-size:.85rem}
  .sheet{padding:16px}
  .scen{padding:18px}
  .intro-grid .fanbig{height:200px}
  .intro-grid .fanbig .pcard{width:120px;margin-left:-60px}
  .actions .btn{flex:1 1 100%}
}
@media (max-width:440px){
  .pips[style*="--n:10"]{grid-template-columns:repeat(5,minmax(0,1fr))}
  .pips[style*="--n:11"]{grid-template-columns:repeat(6,minmax(0,1fr))}
  .pip{height:44px;font-size:1rem}
  .hand .lbl-hand{display:none}
  .bar .btn{padding:13px 18px}
  .ebtn{padding:16px}
}
.bar .btn{min-height:48px}
@media (pointer:coarse) and (max-width:820px){body.typing .bar{transform:translateY(110%)}}
.bar{transition:transform .2s}
.bar .hint{max-width:9rem;text-align:right}
@media (max-width:440px){.bar .in{flex-wrap:wrap;row-gap:6px}.bar .hint{order:-1;flex-basis:100%;max-width:none;text-align:center}}
</style>

let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const get=p=>p.split('.').reduce((o,k)=>o==null?undefined:o[k],S);
const set=(p,v)=>{const k=p.split('.');let o=S;for(let j=0;j<k.length-1;j++){if(o[k[j]]==null||typeof o[k[j]]!=='object')o[k[j]]={};o=o[k[j]]}o[k[k.length-1]]=v;save()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- расчёты ---------- */
const gap=id=>{const f=S.f[id]||{};if(f.sat==null||f.imp==null)return 0;return f.imp*(10-f.sat)/10};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const gapsSorted=()=>F.map(f=>({...f,g:gap(f.id),sat:(S.f[f.id]||{}).sat,imp:(S.f[f.id]||{}).imp})).sort((a,b)=>b.g-a.g);
const pains=()=>gapsSorted().filter(x=>x.g>=4);
const strengths=()=>gapsSorted().filter(x=>x.sat>=7&&x.imp>=6);
const typeScores=()=>{const sc={};for(const t of ORDER)sc[t]=0;EN.forEach(e=>{sc[e.t]+=(S.en[e.id]??0)});return sc};
const topTypes=()=>{const sc=typeScores();return ORDER.split('').sort((a,b)=>sc[b]-sc[a]||ORDER.indexOf(a)-ORDER.indexOf(b)).slice(0,2)};
const burnCount=()=>S.burn.length;
const listRu=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' и '+a[a.length-1];
function scenario(){
  const cond=avg(['money','people','boss','balance'].map(gap)),cont=avg(['tasks','meaning','growth'].map(gap));
  const maxg=Math.max(...F.map(f=>gap(f.id)));
  let base;
  if(maxg<3.5&&S.cause!=='profession')base='crafting';
  else if(S.cause==='conditions'||(cond>cont+1&&S.cause!=='profession'))base='move';
  else base=topTypes().includes(S.cur)?'adjacent':'newdir';
  if(burnCount()>=2||S.cause==='me')return{main:'restore',next:base};
  return{main:base};
}

    <div style="display:flex;align-items:center;gap:12px"><div class="mcard" style="width:84px">${art(S.mak.now)}</div><b style="font:700 1.4rem var(--display);color:var(--coral)">→</b><div class="mcard" style="width:84px">${art(S.mak.want)}</div></div>
    <p>${makName(S.mak.now)} → ${makName(S.mak.want)}${S.mak.word?`. Чувство: <b>${esc(S.mak.word)}</b>`:''}</p>
    ${S.mak.a2?`<div class="kv"><b>Где вы сейчас</b><span>${esc(S.mak.a2)}</span></div>`:''}
    ${S.mak.b1?`<div class="kv"><b>Чего не хватает</b><span>${esc(S.mak.b1)}</span></div>`:''}
   </section>
  </div>

  <div class="grid2">
   <section class="sheet"><span class="eyebrow">4 · Что даёт энергию</span>
    <h3 style="font-size:1.6rem;color:var(--coral)">${t.join('')}</h3><p>${TYPES[t[0]].n} + ${TYPES[t[1]].n}: ${TYPES[t[0]].d}; ${TYPES[t[1]].d}.</p>
    ${S.flow?`<div class="kv"><b>Ваш поток</b><span>${esc(S.flow)}</span></div>`:''}
    <div class="kv"><b>Профессии, где это главное</b></div><div class="dirs">${dirs.map(d=>`<span>${d}</span>`).join('')}</div>
    <p class="note">Это примеры для разговора с собой и информационных интервью, а не приговор.</p>
   </section>
   <section class="sheet"><span class="eyebrow">5 · Что для вас главное</span>
    ${anc.map((x,k)=>`<div class="kv"><b>${k+1} · ${x.n}</b><span>${x.f}</span></div>`).join('')}
    ${S.sac?`<div class="kv"><b>Готовы заплатить</b><span>${esc(S.sac)}${S.sacwhy?' · '+esc(S.sacwhy):''}</span></div>`:''}
    ${S.mir2?`<div class="kv"><b>Признак, что вы пришли</b><span>${esc(S.mir2)}</span></div>`:''}
   </section>
  </div>

  <section class="scen"><span class="eyebrow">6 · Направление</span><h2>${main.t}</h2><p>${main.d}</p>
   ${sc.next?`<p><b>Когда силы вернутся:</b> ${SCEN[sc.next].t.toLowerCase()}. ${SCEN[sc.next].d}</p>`:''}
   <ol>${main.s.map(x=>`<li>${x}</li>`).join('')}</ol>
   ${anc[0]?`<p>Формат, который подойдёт якорю «${anc[0].n}»: ${anc[0].f}.</p>`:''}
  </section>

  <section class="sheet"><span class="eyebrow">Первый ход</span>
   <h3>${S.step?esc(S.step):'Шаг ещё не записан'}</h3>
   ${S.date?`<p>До ${new Date(S.date+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</p>`:''}
   ${S.scale!=null?`<p>Сейчас вы на ${S.scale} из 10.${S.plus1?' Шаг на +1: '+esc(S.plus1):''}</p>`:''}
   ${S.fear?`<p class="note">Страх: ${esc(S.fear)} (вероятность ${S.fearP}%). План Б: ${esc(S.planB)||'—'}.</p>`:''}
  </section>

  <div class="actions"><button class="btn" data-act="share">Отправить итог</button><button class="btn alt" data-act="copy" id="copybtn">Скопировать</button><button class="btn alt" data-act="savetxt">Сохранить файлом</button><button class="btn alt" data-act="review">Вернуться к ответам</button><button class="btn alt ${confirmRestart?'warn':''}" data-act="restart">${confirmRestart?'Точно? Ответы сотрутся':'Сыграть заново'}</button></div>
  <textarea id="copyfall" rows="6" hidden readonly>${esc(summaryText())}</textarea>
  </div>`;
}

/* ---------- маршрут экранов ---------- */
const fv=id=>{const x=S.f[id]||{};return x.sat!=null&&x.imp!=null};
const SC=[{st:-1,r:intro,next:'Начать игру'}];
F.forEach((f,k)=>SC.push({st:0,r:()=>factorScreen(f,k),v:()=>fv(f.id),h:'Поставьте обе оценки'}));
SC.push({st:0,ins:1,r:ins1});
SC.push({st:1,r:mak1,v:()=>!!S.mak.now,h:'Выберите карту'},{st:1,r:mak2,v:()=>!!S.mak.want,h:'Выберите карту'},{st:1,ins:2,r:ins2});
SC.push({st:2,r:abc1},{st:2,r:abc2},{st:2,r:abc3},{st:2,r:abc4,v:()=>!!S.cause,h:'Выберите, что ближе к правде'},{st:2,ins:3,r:ins3});
SC.push({st:3,r:en0,v:()=>!!S.cur,h:'Выберите один вариант'},{st:3,r:en1,v:()=>S.enI>=EN.length,h:'Пройдите колоду до конца'},{st:3,r:en2},{st:3,ins:4,r:ins4});
SC.push({st:4,r:anc1,v:()=>S.anc.length===3,h:'Выберите три карты'},{st:4,r:anc2},{st:4,ins:5,r:ins5});
SC.push({st:5,r:hor1},{st:5,r:hor2,v:()=>S.scale!=null,h:'Отметьте точку на шкале'},{st:5,r:hor3},{st:5,r:hor4,next:'К Карте перемен'});
SC.push({st:6,r:final,fin:true});
if(S.i>=SC.length||S.i<0)S.i=0;

/* ---------- отрисовка ---------- */
const app=document.getElementById('app');
function handCount(){return SC.slice(0,S.i+1).filter(s=>s.ins).length}
function render(anim){
  const s=SC[S.i];const st=s.st;
  const nodes=STATIONS.map((x,k)=>`<div class="node ${k<st?'done':k===st?'now':''}"><span class="dot">${k+1}</span><span class="nlabel">${x.n}</span></div>`).join('')+`<div class="node ${st===6?'now':''}"><span class="dot">★</span><span class="nlabel">Финиш</span></div>`;
  const hc=handCount();
  const ok=!s.v||s.v();
  app.innerHTML=`<div class="wrap">
   <div class="top"><span class="brand">${'<svg viewBox="0 0 160 160" class="art">'+ART.compass+'</svg>'}Компас перемен</span>${S.i>0&&!s.fin?`<button class="ghost ${confirmRestart?'warn':''}" data-act="restart">${confirmRestart?'Точно? Ответы сотрутся':'Начать заново'}</button>`:''}</div>
   ${S.i>0?`<nav class="route" aria-label="Маршрут">${nodes}</nav>`:''}
   <main class="${anim?'deal':''}">${s.r()}</main></div>
   ${s.fin?'':`<div class="bar"><div class="in">
     ${S.i>0?`<button class="btn alt" data-act="back">Назад</button>`:''}
     <div class="hand">${S.i>0?`<span class="fan" aria-hidden="true">${[0,1,2,3,4].map(k=>`<i class="${k<hc?'':'empty'}"></i>`).join('')}</span><span class="lbl-hand">В руке ${hc} из 5</span><span class="sr">${hc}/5</span>`:''}</div>${!ok?`<span class="hint">${s.h||''}</span>`:''}
     <button class="btn" data-act="next" id="nextbtn" ${ok?'':'disabled'}>${s.next||'Дальше'}</button></div></div>`}`;
}
function go(i,fromPop){S.i=i;confirmRestart=false;save();render(true);window.scrollTo(0,0);
  if(!fromPop){try{history.pushState({i},'','#s'+i)}catch(e){}}}
try{history.replaceState({i:S.i},'','#s'+S.i)}catch(e){}
window.addEventListener('popstate',e=>{const i=e.state&&typeof e.state.i==='number'?e.state.i:0;if(i>=0&&i<SC.length)go(i,true)});
function copyFallback(){const f=document.getElementById('copyfall');if(f){f.hidden=false;f.focus();f.select()}}
function saveTxt(){const t=summaryText();try{const b=new Blob([t],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='karta-peremen.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}catch(e){copyFallback()}}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,p=b.dataset.path,v=b.dataset.v;
  if(a!=='restart')confirmRestart=false;
  switch(a){
    case'next':{const s=SC[S.i];if(s.v&&!s.v())return;go(S.i+1);return}
    case'back':go(Math.max(0,S.i-1));return;
    case'rate':set(p,+v);break;
    case'pick':set(p,get(p)===v&&p!=='cause'&&p!=='cur'?'':v);break;
    case'toggle':{const arr=[...(get(p)||[])];const k=arr.indexOf(v);k>-1?arr.splice(k,1):arr.push(v);set(p,arr);break}
    case'en':S.en[EN[S.enI].id]=+v;S.enI++;save();render(true);return;
    case'enback':S.enI=Math.max(0,S.enI-1);save();render(true);return;
    case'enset':S.en[b.dataset.id]=+v;save();break;
    case'enreset':S.enI=0;save();render(true);return;
    case'anc':{const k=S.anc.indexOf(v);if(k>-1)S.anc.splice(k,1);else if(S.anc.length<3)S.anc.push(v);save();break}
    case'fill':set('step',v);break;
    case'review':go(1);return;
    case'restart':if(confirmRestart){S=fresh();confirmRestart=false;save();go(0);return}confirmRestart=true;break;
    case'copy':{const t=summaryText();const done=()=>{b.textContent='Скопировано'};
      try{navigator.clipboard.writeText(t).then(done,copyFallback)}catch(err){copyFallback()}
      return}
    case'share':{const t=summaryText();
      if(navigator.share){navigator.share({title:'Карта перемен',text:t}).catch(()=>{})}
      else{try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Скопировано — вставьте в чат'},copyFallback)}catch(err){copyFallback()}}
      return}
    case'savetxt':saveTxt();return;
  }
  render(false);
});
app.addEventListener('input',e=>{
  const el=e.target.closest('[data-bind]');if(!el)return;
  const val=el.type==='range'?+el.value:el.value;set(el.dataset.bind,val);
  if(el.type==='range'){const o=document.getElementById(el.id+'-o');if(o)o.textContent=val+(el.dataset.suf||'')}
});
document.addEventListener('focusin',e=>{if(e.target.matches('textarea,input[type=text],input[type=date]'))document.body.classList.add('typing')});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches('textarea,input[type=text],input[type=date]'))document.body.classList.remove('typing')},50));
let sx=null,sy=0;
app.addEventListener('touchstart',e=>{const c=e.target.closest('#ecard');if(!c)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
app.addEventListener('touchmove',e=>{if(sx==null)return;const c=document.getElementById('ecard');const dx=e.touches[0].clientX-sx;if(Math.abs(dx)>Math.abs(e.touches[0].clientY-sy))c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`},{passive:true});
app.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;const c=document.getElementById('ecard');
  if(Math.abs(dx)>80&&S.enI<EN.length){S.en[EN[S.enI].id]=dx>0?1:-1;S.enI++;save();render(true)}else if(c)c.style.transform=''});
render(true);
</script>

</body>
</html>
